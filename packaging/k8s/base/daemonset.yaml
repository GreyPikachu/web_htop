apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: web-htop
  labels:
    app.kubernetes.io/name: web-htop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web-htop
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-htop
    spec:
      # Required for host-wide process correlation. This prevents compliance
      # with the Pod Security Standards baseline/restricted profiles.
      hostPID: true
      hostNetwork: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: server
          image: ghcr.io/romansnitko/web_htop:latest
          imagePullPolicy: IfNotPresent
          args:
            - --proc-root
            - /host/proc
            - --sys-root
            - /host/sys
            - --mount
            - /host/root
            - --bind
            - 0.0.0.0
            - --http-port
            - "8080"
            - --stream-port
            - "9999"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 9999
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
