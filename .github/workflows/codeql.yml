name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure
        run: >-
          cmake -S . -B build-codeql
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DWEB_HTOP_BUILD_APPS=ON
          -DWEB_HTOP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-codeql --parallel 2

      - name: Test
        run: ctest --test-dir build-codeql --output-on-failure --no-tests=error

      - name: Analyze
        uses: github/codeql-action/analyze@v3
